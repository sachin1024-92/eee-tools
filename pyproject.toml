[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eee-tools"
version = "0.1.0"
description = "Tested calculators for Electrical & Electronics Engineering: high voltage, signals, power systems, drives"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sachin Majhee" }]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["eeetools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
